<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rolling Stock | Technical Assessment</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');

        :root {
            --accent-red: #e63946;
            --accent-red-dim: #9b2226;
            --header-bg: #1a1a1a;
            --page-bg: #0a0a0a;
            --card-bg: #141414;
            --surface-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --success: #10b981;
            --error: #ef4444;
            --border: #2a2a2a;
            --bebo-purple: #a855f7;
            --bebo-bg: #1e1e2e;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--page-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        header {
            background-color: var(--header-bg);
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid var(--accent-red);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        header h1 {
            color: var(--text-main);
            font-size: 1.25rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 800;
        }

        header h1 span {
            color: var(--accent-red);
        }

        .viewport {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 15px;
        }

        .assessment-container {
            width: 100%;
            max-width: 750px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 2.5rem;
            border-radius: 8px;
            position: relative;
            transition: var(--transition);
            animation: cardEnter 0.6s ease-out;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        @keyframes cardEnter {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .progress-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: #222;
            border-radius: 8px 8px 0 0;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-red-dim), var(--accent-red));
            transition: width 0.5s var(--transition);
            box-shadow: 0 0 10px var(--accent-red);
        }

        .ui-top-row {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 2rem;
            gap: 20px;
        }

        .bebo-integration {
            display: flex;
            align-items: center;
            gap: 15px;
            position: relative;
        }

        .bebo-visual {
            width: 60px;
            height: 60px;
            background: var(--bebo-bg);
            border-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            position: relative;
            box-shadow: inset 0 0 15px rgba(255,255,255,0.05), 0 10px 20px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
            transition: transform 0.3s ease;
        }

        .bebo-eye {
            width: 10px;
            height: 14px;
            background: var(--bebo-purple);
            border-radius: 4px;
            box-shadow: 0 0 15px var(--bebo-purple);
            transition: all 0.3s ease;
        }

        .bebo-visual.thinking .bebo-eye { height: 4px; opacity: 0.6; }
        .bebo-visual.correct .bebo-eye { background: #10b981; box-shadow: 0 0 15px #10b981; height: 16px; }
        .bebo-visual.error .bebo-eye { background: var(--error); box-shadow: 0 0 15px var(--error); transform: scaleY(0.5); }
        .bebo-visual.aggressive .bebo-eye { background: #facc15; box-shadow: 0 0 15px #facc15; transform: rotate(15deg); }

        .bebo-bubble {
            background: #1e1e1e;
            border: 1px solid var(--border);
            padding: 12px 18px;
            border-radius: 4px 16px 16px 16px;
            font-size: 0.85rem;
            color: var(--text-main);
            max-width: 250px;
            line-height: 1.4;
            opacity: 0;
            transform: translateX(-10px);
            transition: all 0.4s ease;
            pointer-events: none;
            direction: rtl;
        }

        .bebo-bubble.active {
            opacity: 1;
            transform: translateX(0);
        }

        .controls-group {
            display: flex;
            flex-direction: column;
            align-items: flex-end;
            gap: 10px;
        }

        .context-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--accent-red);
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 5px 10px;
            background: rgba(230, 57, 70, 0.1);
            border-radius: 2px;
        }

        .hint-toggle {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-dim);
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 6px 12px;
            cursor: pointer;
            border-radius: 2px;
            transition: var(--transition);
        }

        .hint-toggle:hover { border-color: var(--text-dim); color: white; }

        .hint-box {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out, margin 0.3s ease, padding 0.3s ease;
            background: #0f0f0f;
            border-left: 2px solid var(--accent-red);
        }

        .hint-box.visible {
            max-height: 200px;
            margin-bottom: 1.5rem;
            padding: 1.2rem;
            overflow-y: auto;
        }

        .hint-content { color: var(--text-dim); font-size: 0.85rem; line-height: 1.6; }

        .meta-info { font-size: 0.75rem; color: var(--text-dim); margin-bottom: 1rem; font-weight: 600; letter-spacing: 1px; }

        .question-body { font-size: 1.25rem; font-weight: 600; line-height: 1.5; margin-bottom: 2.5rem; color: #fff; }

        .response-grid { display: grid; gap: 12px; margin-bottom: 2rem; }
        .response-grid.dual { grid-template-columns: 1fr 1fr; }

        .option-btn {
            background: var(--surface-bg);
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 1.1rem 1.4rem;
            text-align: left;
            font-size: 0.95rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 15px;
            border-radius: 4px;
            width: 100%;
        }

        .option-btn span {
            flex-shrink: 0;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            color: var(--accent-red);
            background: rgba(230, 57, 70, 0.1);
            border-radius: 2px;
            font-size: 0.75rem;
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--accent-red);
            color: #fff;
            background: #252525;
            transform: translateX(4px);
        }

        .option-btn.correct { background: rgba(16, 185, 129, 0.1) !important; border-color: var(--success) !important; color: var(--success) !important; }
        .option-btn.wrong { background: rgba(239, 68, 68, 0.1) !important; border-color: var(--error) !important; color: var(--error) !important; }

        .navigation-row { display: flex; justify-content: space-between; align-items: center; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border); }
        .nav-link { background: none; border: none; color: var(--text-dim); font-size: 0.75rem; font-weight: 600; text-transform: uppercase; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: var(--transition); }
        .nav-link:hover { color: white; }

        .action-btn { background: var(--accent-red); color: #fff; border: none; padding: 0.8rem 1.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: var(--transition); border-radius: 4px; font-size: 0.8rem; }
        .action-btn:hover { background: #f84d5b; box-shadow: 0 0 20px rgba(230, 57, 70, 0.3); }
        .action-btn:disabled { background: #333; cursor: not-allowed; opacity: 0.5; }

        .clear-link { display: block; text-align: center; margin-top: 2rem; color: #444; font-size: 0.7rem; text-decoration: none; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; transition: color 0.2s; }
        .clear-link:hover { color: var(--text-dim); }

        .results-panel { text-align: center; padding: 4rem 2rem; }
        .score-display { font-size: 4rem; font-weight: 800; color: var(--accent-red); margin: 0.5rem 0; }
        .score-sub { color: var(--text-dim); margin-bottom: 1.5rem; text-transform: uppercase; letter-spacing: 2px; font-size: 0.85rem; }
        
        /* Personalized Result Message */
        .bebo-final-message {
            background: rgba(255, 255, 255, 0.03);
            border: 1px dashed var(--border);
            padding: 1.5rem;
            border-radius: 8px;
            color: #fff;
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 2.5rem;
            direction: rtl;
        }

        footer { background: #000; padding: 2rem; text-align: center; color: #444; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px; border-top: 1px solid #1a1a1a; }
        .hidden { display: none; }
        svg { width: 18px; height: 18px; fill: currentColor; }

        @media (max-width: 600px) {
            .ui-top-row { flex-direction: column; align-items: flex-start; }
            .bebo-integration { width: 100%; }
            .bebo-bubble { max-width: none; flex: 1; }
            .controls-group { width: 100%; flex-direction: row; justify-content: space-between; align-items: center; }
            .response-grid.dual { grid-template-columns: 1fr; }
            .card { padding: 1.5rem; }
        }
    </style>
</head>

    <footer>Professional Technical Assessment Framework &copy; 2026</footer>

    <script>
        const quizData = [
            { type: "tf", q: "Modern railway systems aim to provide safe and comfortable transportation.", a: true, h: "Safety and comfort are core objectives in railway design and operation." },
            { type: "tf", q: "HVAC systems improve air quality inside railway coaches.", a: true, h: "HVAC systems filter and circulate air to maintain quality in enclosed spaces." },
            { type: "tf", q: "The evaporator coil releases heat to the outside air.", a: false, h: "The evaporator absorbs heat from inside; the condenser releases it outside." },
            { type: "tf", q: "Escalators help improve passenger flow in railway stations.", a: true, h: "Escalators facilitate vertical movement and improve station throughput." },
            { type: "tf", q: "The electric drive provides power to move escalator steps.", a: true, h: "Electric motors drive the chain mechanism that moves the steps." },
            { type: "tf", q: "Auxiliary systems are not necessary for train operation.", a: false, h: "Auxiliary systems like batteries and generators support essential functions." },
            { type: "tf", q: "Compressed air systems are used to operate train brakes.", a: true, h: "Air brakes rely on compressed air for actuation and control." },
            { type: "tf", q: "The air compressor produces compressed air in locomotives.", a: true, h: "Compressors generate the high-pressure air needed for braking systems." },
            { type: "tf", q: "The main reservoir stores compressed air.", a: true, h: "Reservoirs store compressed air for use in braking and other systems." },
            { type: "tf", q: "Comfort and safety systems work together in modern railway engineering.", a: true, h: "Integrated systems ensure both passenger comfort and operational safety." },
            { type: "mcq", q: "HVAC stands for:", options: ["Heat Valve Air Control", "Heating Ventilation and Air Conditioning", "High Voltage Air Control", "Heat Variation Air Cooling"], a: 1, h: "HVAC is the standard acronym for climate control systems." },
            { type: "mcq", q: "The main purpose of HVAC systems in railway coaches is to:", options: ["Increase train speed", "Maintain comfortable temperature and air quality", "Reduce train weight", "Control train brakes"], a: 1, h: "HVAC primarily focuses on passenger comfort through temperature and air management." },
            { type: "mcq", q: "Which component compresses refrigerant gas in the HVAC system?", options: ["Evaporator", "Compressor", "Condenser", "Air filter"], a: 1, h: "The compressor increases refrigerant pressure in the cooling cycle." },
            { type: "mcq", q: "Which component releases heat to the outside air?", options: ["Condenser coil", "Evaporator coil", "Air filter", "Blower fan"], a: 0, h: "The condenser dissipates heat from the refrigerant to the environment." },
            { type: "mcq", q: "Escalators in railway stations are mainly used to:", options: ["Increase train power", "Transport passengers between levels", "Control railway signals", "Operate train doors"], a: 1, h: "Escalators provide vertical transportation in multi-level stations." },
            { type: "mcq", q: "Which of the following is an escalator component?", options: ["Step chain", "Gear reduction", "Electric drive", "All of the above"], a: 3, h: "Escalators consist of multiple mechanical components working together." },

            { type: "mcq", q: "Which system is mainly responsible for operating train air brakes?", options: ["Hydraulic system", "Compressed air system", "Cooling system", "Fuel system"], a: 1, h: "Air brakes use compressed air to apply braking force." },
            { type: "mcq", q: "The air dryer in a compressed air system is used to:", options: ["Increase air pressure", "Remove moisture from compressed air", "Cool the locomotive engine", "Generate electricity"], a: 1, h: "Dryers prevent water accumulation that could cause system failures." },
            { type: "mcq", q: "Alternators in trains are used to:", options: ["Generate AC electrical power", "Control escalators", "Reduce train speed", "Compress air"], a: 0, h: "Alternators convert mechanical energy to electrical power." },
            { type: "mcq", q: "What is the primary function of a train coupler?", options: ["Passenger comfort", "Coach decoration", "Connecting coaches and transmitting forces", "Noise insulation"], a: 2, h: "Rolling stock requires a mechanical link to transmit traction and braking forces along the train." },
            { type: "mcq", q: "Which coupler is considered obsolete due to safety risks?", options: ["Buckeye", "Screw coupling", "Bar coupler", "Link-and-Pin"], a: 3, h: "This 19th-century system caused many fatalities as staff had to stand between cars to insert pins." },

            { type: "mcq", q: "The Screw Coupling relies on which additional component to absorb shock?", options: ["Knuckle", "Air springs", "Side buffers", "Gear box"], a: 2, h: "Side buffers handle the compression forces, while the screw coupling handles the tension." },
            { type: "mcq", q: "Which coupler integrates mechanical, pneumatic, and electrical connections automatically?", options: ["Buckeye", "Bar coupler", "Screw coupling", "Scharfenberg"], a: 3, h: "A high-tech coupler that automatically connects air and signal lines simultaneously." },
            { type: "mcq", q: "Which coupler is standard for heavy-haul freight (knuckle shape)?", options: ["Screw coupling", "Buckeye (Janney/Knuckle) coupler", "Bar coupler", "Link-and-Pin"], a: 1, h: "The knuckle design is robust enough for extremely heavy freight trains." },
            { type: "mcq", q: "Which door type is considered a major safety risk?", options: ["Plug doors", "Sliding pocket doors", "Slam doors", "External sliding doors"], a: 2, h: "These manually latched doors could swing open during motion and were phased out for safety." },

],
            resultsSuccess: [
                "  مش قولتلك دحيح جامد يعم اتكل على الله يلا من هنا.",
                "المعيد القادم .",
                "اوعي تتغر بالنتيجه دى يا صحبي ."
            ]
        };

        const beboVisual = document.getElementById('bebo-visual');
        const beboBubble = document.getElementById('bebo-bubble');

        function showBeboMessage(category) {
            const msgs = beboMessages[category];
            const msg = msgs[Math.floor(Math.random() * msgs.length)];
            
            beboBubble.innerText = msg;
            beboBubble.classList.add('active');
            
            beboVisual.className = "bebo-visual";
            if (category === 'correct') beboVisual.classList.add('correct');
            if (category === 'wrong') beboVisual.classList.add('error');
            if (category === 'aggressive') beboVisual.classList.add('aggressive');
            if (category === 'fast') beboVisual.classList.add('thinking');

            setTimeout(() => { if(currentIndex < quizData.length) beboVisual.className = "bebo-visual"; }, 3000);
        }

        function init() {
            document.getElementById('total-questions').innerText = quizData.length.toString().padStart(2, '0');
            renderQuestion();
            setTimeout(() => showBeboMessage('intro'), 800);
        }

        function toggleHint() {
            document.getElementById('hint-box').classList.toggle('visible');
        }

        function renderQuestion() {
            const data = quizData[currentIndex];
            document.getElementById('current-index').innerText = (currentIndex + 1).toString().padStart(2, '0');
            document.getElementById('question-content').innerText = data.q;
            document.getElementById('hint-text').innerText = data.h;
            document.getElementById('hint-box').classList.remove('visible');
            
            updateProgressBar();
            startTime = Date.now();

            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';
            const isAnswered = userAnswers[currentIndex] !== null;
            
            const nextBtn = document.getElementById('next-btn');
            nextBtn.disabled = !isAnswered;
            nextBtn.innerText = (currentIndex === quizData.length - 1) ? "Finish Assessment" : "Next Question";
            document.getElementById('prev-btn').style.visibility = (currentIndex === 0) ? "hidden" : "visible";

            if (data.type === "mcq") {
                optionsContainer.className = "response-grid";
                data.options.forEach((opt, i) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerHTML = `<span>${String.fromCharCode(65 + i)}</span> ${opt}`;
                    btn.onclick = () => handleSelect(i);
                    if (isAnswered) {
                        btn.disabled = true;
                        if (i === data.a) btn.classList.add('correct');
                        if (userAnswers[currentIndex] === i && i !== data.a) btn.classList.add('wrong');
                    }
                    optionsContainer.appendChild(btn);
                });
            } else {
                optionsContainer.className = "response-grid dual";
                [true, false].forEach((val) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.style.justifyContent = "center";
                    btn.innerText = val ? "TRUE" : "FALSE";
                    btn.onclick = () => handleSelect(val);
                    if (isAnswered) {
                        btn.disabled = true;
                        if (val === data.a) btn.classList.add('correct');
                        if (userAnswers[currentIndex] === val && val !== data.a) btn.classList.add('wrong');
                    }
                    optionsContainer.appendChild(btn);
                });
            }
        }

        function handleSelect(choice) {
            if (userAnswers[currentIndex] !== null) return;
            const elapsed = Date.now() - startTime;
            userAnswers[currentIndex] = choice;
            const isCorrect = choice === quizData[currentIndex].a;

            if (elapsed < 1500 && isCorrect) {
                showBeboMessage('fast');
            } else if (isCorrect) {
                consecutiveMistakes = 0;
                showBeboMessage('correct');
            } else {
                consecutiveMistakes++;
                if (consecutiveMistakes >= 3) {
                    showBeboMessage('aggressive');
                } else {
                    showBeboMessage('wrong');
                }
            }
            renderQuestion();
        }

        function goNext() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                renderQuestion();
            } else {
                showResults();
            }
        }

        function goPrev() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        function clearAnswer() {
            if (userAnswers[currentIndex] === null) return;
            userAnswers[currentIndex] = null;
            renderQuestion();
        }

        function updateProgressBar() {
            const answeredCount = userAnswers.filter(a => a !== null).length;
            const progress = (answeredCount / quizData.length) * 100;
            document.getElementById('progress-bar').style.width = progress + '%';
        }

        function showResults() {
            document.getElementById('quiz-ui').classList.add('hidden');
            document.getElementById('results-ui').classList.remove('hidden');
            
            let correctCount = userAnswers.filter((ans, i) => ans === quizData[i].a).length;
            const percentage = Math.round((correctCount / quizData.length) * 100);
            
            document.getElementById('final-percentage').innerText = percentage + '%';
            document.getElementById('final-raw').innerText = `${correctCount} / ${quizData.length} Correct Responses`;
            
            // Intelligence for Final Score
            const finalMsgEl = document.getElementById('final-bebo-message');
            if (percentage >= 85) {
                const msgs = beboMessages.resultsSuccess;
                finalMsgEl.innerText = msgs[Math.floor(Math.random() * msgs.length)];
                beboVisual.className = "bebo-visual correct";
            } else {
                const msgs = beboMessages.resultsAdvice;
                finalMsgEl.innerText = msgs[Math.floor(Math.random() * msgs.length)];
                beboVisual.className = "bebo-visual thinking";
            }
            
            showBeboMessage('complete');
        }

        window.onload = init;
    </script>
</body>
</html>
