<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rolling Stock | Technical Command Center</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Rajdhani:wght@500;600;700&family=Tajawal:wght@400;500;700&display=swap');

        :root {
            --accent-red: #ff3e3e;
            --accent-red-glow: rgba(255, 62, 62, 0.6);
            --accent-red-dim: rgba(255, 62, 62, 0.15);
            --bg-page: #040406;
            --bg-card: rgba(16, 16, 22, 0.94);
            --bg-surface: rgba(35, 35, 45, 0.7);
            --text-main: #f8fafc;
            --text-dim: #94a3b8;
            --border-subtle: rgba(255, 255, 255, 0.1);
            --bebo-purple: #c084fc;
            --bebo-green: #22c55e;
            --glass-blur: blur(15px);
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-page);
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                radial-gradient(circle at 50% 0%, rgba(255, 62, 62, 0.08) 0%, transparent 60%);
            background-size: 25px 25px, 25px 25px, 100% 100%;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
            direction: ltr;
        }

        /* --- Header: More compact --- */
        header {
            background: rgba(10, 10, 15, 0.85);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 1px solid var(--border-subtle);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.3rem;
            letter-spacing: 6px;
            text-transform: uppercase;
            font-weight: 700;
        }

        header h1 span { color: var(--accent-red); text-shadow: 0 0 10px var(--accent-red-glow); }

        .header-line {
            position: absolute;
            bottom: -1px;
            left: 50%;
            transform: translateX(-50%);
            width: 120px;
            height: 2px;
            background: var(--accent-red);
            box-shadow: 0 0 10px var(--accent-red);
        }

        .viewport {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 25px 8px 12px 8px;
        }

        .assessment-container {
            width: 100%;
            max-width: 650px; /* Optimized for mobile */
        }

        /* --- Bebo Section --- */
        .bebo-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 1rem;
            position: relative;
        }

        @media (min-width: 768px) { .bebo-wrapper { align-items: flex-end; } }

        .bebo-bubble {
            background: rgba(25, 32, 48, 0.96);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-subtle);
            padding: 6px 12px;
            border-radius: 10px;
            font-size: 0.8rem;
            color: #fff;
            margin-bottom: 6px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.5);
            max-width: 320px;
            transition: all 0.4s ease;
            opacity: 0;
            transform: translateY(8px);
            font-family: 'Tajawal', sans-serif;
            text-align: right;
            direction: rtl;
        }

        .bebo-bubble.active { opacity: 1; transform: translateY(0); }

        .bebo-robot {
            width: 48px;
            height: 48px;
            background: linear-gradient(145deg, #2a3445, #0d121a);
            border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.15);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .eyes-container { display: flex; gap: 8px; }
        .eye { width: 8px; height: 8px; background: var(--bebo-purple); border-radius: 50%; box-shadow: 0 0 8px var(--bebo-purple); }
        .bebo-robot.success .eye { background: var(--bebo-green); height: 4px; border-radius: 4px 4px 0 0; }
        .bebo-robot.error .eye { background: var(--accent-red); height: 3px; border-radius: 2px; transform: rotate(-15deg); }

        /* --- Compact Card Design --- */
        .card {
            background: var(--bg-card);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--border-subtle);
            padding: 1.2rem 1rem; /* Ultra compact padding */
            border-radius: 16px;
            position: relative;
            box-shadow: 0 30px 80px -20px rgba(0, 0, 0, 0.9);
            overflow: hidden;
        }

        .progress-tracker {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 3px;
            background: rgba(255,255,255,0.02);
        }

        .progress-fill {
            height: 100%; width: 0%;
            background: linear-gradient(90deg, var(--accent-red), #ff7e7e);
            box-shadow: 0 0 10px var(--accent-red);
            transition: width 0.8s cubic-bezier(0.19, 1, 0.22, 1);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.8rem;
        }

        .meta-info {
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.8rem;
            color: var(--accent-red);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 3px;
        }

        .hint-toggle {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-subtle);
            color: var(--text-dim);
            width: 34px; height: 34px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .hint-display {
            max-height: 0;
            overflow: hidden;
            transition: all 0.5s ease;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 12px;
        }

        .hint-display.active {
            max-height: 200px;
            padding: 0.8rem;
            margin-bottom: 1rem;
            border-left: 3px solid var(--accent-red);
        }

        /* --- Question Area: Scaled Down --- */
        .question-body {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 1.2rem;
        }

        .q-ar-box {
            background: rgba(255, 62, 62, 0.03);
            border: 1px solid rgba(255, 62, 62, 0.08);
            border-left: 3px solid var(--accent-red);
            padding: 0.6rem 0.8rem;
            border-radius: 4px 10px 10px 4px;
            font-family: 'Tajawal', sans-serif;
            font-size: 0.85rem;
            color: var(--text-dim);
            direction: rtl;
            text-align: right;
        }

        .q-en-main {
            font-size: 1.1rem; /* More compact English text */
            font-weight: 600;
            line-height: 1.35;
            color: #fff;
        }

        /* --- Options: Tighter Layout --- */
        .options-grid {
            display: grid;
            gap: 8px;
            margin-bottom: 1.2rem;
        }

        .options-grid.two-cols { grid-template-columns: 1fr 1fr; }

        .option-btn {
            background: var(--bg-surface);
            border: 1px solid var(--border-subtle);
            color: var(--text-dim);
            padding: 0.65rem 0.85rem;
            text-align: left;
            font-size: 0.85rem;
            cursor: pointer;
            border-radius: 10px;
            transition: all var(--transition);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .option-btn .char-idx {
            background: rgba(255, 255, 255, 0.08);
            color: var(--accent-red);
            width: 24px; height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 5px;
            font-weight: 700;
            font-family: 'Rajdhani', sans-serif;
            font-size: 0.8rem;
        }

        .option-btn:hover:not(:disabled) {
            border-color: rgba(255, 255, 255, 0.3);
            color: #fff;
            transform: translateX(4px);
        }

        .option-btn.correct { background: rgba(34, 197, 94, 0.15) !important; border-color: var(--bebo-green) !important; color: #fff !important; }
        .option-btn.wrong { background: rgba(255, 62, 62, 0.15) !important; border-color: var(--accent-red) !important; color: #fff !important; }

        /* --- Footer Nav --- */
        .footer-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 0.8rem;
            border-top: 1px solid var(--border-subtle);
        }

        .nav-actions-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-nav {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 2px;
            font-family: 'Rajdhani', sans-serif;
        }

        .btn-nav:disabled { opacity: 0; }

        .btn-primary {
            background: var(--accent-red);
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 7px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-size: 0.75rem;
            cursor: pointer;
            font-family: 'Rajdhani', sans-serif;
        }

        /* --- Results View --- */
        .results-view { text-align: center; }
        .final-pct { font-size: 4rem; font-weight: 700; color: var(--accent-red); font-family: 'Rajdhani', sans-serif; }
        .feedback-container {
            background: rgba(255, 255, 255, 0.03);
            padding: 2rem;
            border-radius: 15px;
            margin-bottom: 2rem;
            font-size: 1.1rem;
            direction: rtl;
            font-family: 'Tajawal', sans-serif;
        }

        footer {
            background: rgba(2, 2, 4, 0.98);
            padding: 3rem 1rem;
            text-align: center;
            color: #555;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 6px;
            border-top: 1px solid #111;
            font-family: 'Rajdhani', sans-serif;
        }

        .hidden { display: none !important; }

        @media (max-width: 600px) {
            .options-grid.two-cols { grid-template-columns: 1fr; }
            .card { padding: 1rem 0.85rem; }
            .q-en-main { font-size: 0.95rem; }
            .bebo-bubble { max-width: 280px; font-size: 0.75rem; }
            .footer-nav { flex-direction: column-reverse; gap: 12px; align-items: stretch; }
            .nav-actions-right { justify-content: space-between; }
            .btn-primary { width: 100%; text-align: center; padding: 7px 16px; }
            header { height: 50px; }
            header h1 { font-size: 1.1rem; letter-spacing: 4px; }
        }
        
        @media (max-width: 480px) {
            .assessment-container { max-width: 100%; }
            .card { padding: 0.9rem 0.75rem; border-radius: 14px; }
            .q-en-main { font-size: 0.9rem; }
            .option-btn { padding: 0.55rem 0.7rem; font-size: 0.8rem; gap: 8px; }
            .bebo-wrapper { margin-bottom: 0.6rem; }
            .bebo-robot { width: 42px; height: 42px; border-radius: 12px; }
            header h1 { font-size: 1rem; }
            .meta-info { font-size: 0.7rem; letter-spacing: 2px; }
            .btn-nav { font-size: 0.7rem; }
            .q-ar-box { font-size: 0.8rem; padding: 0.5rem 0.7rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-line"></div>
        <h1>ROLLING<span>STOCK</span></h1>
    </header>

    <main class="viewport">
        <div class="assessment-container">
            
            <div class="bebo-wrapper">
                <div class="bebo-bubble" id="bebo-bubble">جاري تهيئة الأنظمة...</div>
                <div class="bebo-robot" id="bebo-robot">
                    <div class="eyes-container">
                        <div class="eye"></div>
                        <div class="eye"></div>
                    </div>
                </div>
            </div>

            <div id="quiz-ui">
                <div class="card">
                    <div class="progress-tracker">
                        <div class="progress-fill" id="progress-bar"></div>
                    </div>

                    <div class="card-header">
                        <div class="meta-info">POINT <span id="current-idx">01</span> / <span id="total-idx">00</span></div>
                        <button class="hint-toggle" onclick="toggleHint()" title="Reveal Intel">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3m.08 4h.01M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/></svg>
                        </button>
                    </div>

                    <div class="hint-display" id="hint-panel">
                        <div id="hint-text"></div>
                    </div>

                    <div class="question-body" id="question-text"></div>

                    <div id="options-container" class="options-grid"></div>

                    <div class="footer-nav">
                        <button class="btn-nav" id="btn-prev" onclick="move(-1)">BACK</button>
                        <div class="nav-actions-right">
                            <button class="btn-nav" id="btn-skip" onclick="move(1)">SKIP</button>
                            <button class="btn-primary" id="btn-next" onclick="move(1)" disabled>NEXT</button>
                        </div>
                    </div>
                </div>
            </div>

            <div id="results-ui" class="hidden">
                <div class="card results-view">
                    <div class="meta-info">ANALYSIS COMPLETE</div>
                    <div class="final-pct" id="final-pct">0%</div>
                    <div class="feedback-container" id="final-feedback">...</div>
                    <button class="btn-primary" style="width: 100%" onclick="location.reload()">RESTART ASSESSMENT</button>
                </div>
            </div>

        </div>
    </main>

    <footer>Development Bilal Mohamed</footer>

    <script>
        const quizData = [
            { type: "tf", q_en: "Modern railway systems aim to provide safe and comfortable transportation.", q_ar: "تهدف أنظمة السكك الحديدية الحديثة إلى توفير نقل آمن ومريح.", a: true, h_en: "Safety and comfort are core objectives.", h_ar: "السلامة والراحة هما الأهداف الأساسية في التصميم." },
            { type: "tf", q_en: "HVAC systems improve air quality inside railway coaches.", q_ar: "تعمل أنظمة التكييف (HVAC) على تحسين جودة الهواء داخل العربات.", a: true, h_en: "HVAC filters and circulates air.", h_ar: "تقوم أنظمة التكييف بفلترة وتدوير الهواء." },
            { type: "tf", q_en: "The evaporator coil releases heat to the outside air.", q_ar: "ملف المبخر يقوم بطرد الحرارة إلى الهواء الخارجي.", a: false, h_en: "Condenser releases heat, Evaporator absorbs it.", h_ar: "المكثف يطرد الحرارة والمبخر يمتصها." },
            { type: "tf", q_en: "Escalators help improve passenger flow in railway stations.", q_ar: "تساعد السلالم المتحركة في تحسين تدفق الركاب بالمحطات.", a: true, h_en: "Escalators facilitate vertical movement.", h_ar: "تسهل السلالم المتحركة الحركة الرأسية." },
            { type: "tf", q_en: "The electric drive provides power to move escalator steps.", q_ar: "يوفر المحرك الكهربائي الطاقة لتحريك درجات السلم.", a: true, h_en: "Motors drive the chain mechanism.", h_ar: "تقوم المحركات بتشغيل آلية السلسلة." },
            { type: "tf", q_en: "Auxiliary systems are not necessary for train operation.", q_ar: "الأنظمة المساعدة ليست ضرورية لتشغيل القطار.", a: false, h_en: "Auxiliary systems support essential functions.", h_ar: "الأنظمة المساعدة تدعم الوظائف الحيوية." },
            { type: "tf", q_en: "Compressed air systems are used to operate train brakes.", q_ar: "تُستخدم أنظمة الهواء المضغوط لتشغيل مكابح القطار.", a: true, h_en: "Air brakes rely on high pressure.", h_ar: "تعتمد الفرامل على الهواء المضغوط." },
            { type: "tf", q_en: "The air compressor produces compressed air in locomotives.", q_ar: "يقوم ضاغط الهواء بإنتاج الهواء المضغوط في القاطرات.", a: true, h_en: "Compressors generate needed pressure.", h_ar: "الضواغط تولد الضغط اللازم للكبح." },
            { type: "tf", q_en: "The main reservoir stores compressed air.", q_ar: "يقوم الخزان الرئيسي بتخزين الهواء المضغوط.", a: true, h_en: "Reservoirs store air for various systems.", h_ar: "الخزانات تخزن الهواء للاستخدام في الكبح." },
            { type: "tf", q_en: "Comfort and safety systems work together in modern railway engineering.", q_ar: "تعمل أنظمة الراحة والسلامة معاً في هندسة السكك الحديدية الحديثة.", a: true, h_en: "Integrated systems ensure both.", h_ar: "تضمن الأنظمة المتكاملة الراحة والسلامة معاً." },
            { type: "mcq", q_en: "HVAC stands for:", q_ar: "يرمز اختصار HVAC إلى:", options: ["Heat Valve Air Control", "Heating Ventilation and Air Conditioning", "High Voltage Air Control", "Heat Variation Air Cooling"], a: 1, h_en: "Climate control acronym.", h_ar: "هو اختصار أنظمة التدفئة والتهوية والتكييف." },
            { type: "mcq", q_en: "The main purpose of HVAC systems in railway coaches is to:", q_ar: "الغرض الأساسي من أنظمة HVAC في عربات القطار هو:", options: ["Increase train speed", "Maintain comfortable temperature and air quality", "Reduce train weight", "Control train brakes"], a: 1, h_en: "Temperature and air management.", h_ar: "إدارة الحرارة والهواء لراحة الركاب." },
            { type: "mcq", q_en: "Which component compresses refrigerant gas in the HVAC system?", q_ar: "أي مكون يقوم بضغط غاز التبريد في نظام HVAC؟", options: ["Evaporator", "Compressor", "Condenser", "Air filter"], a: 1, h_en: "Compressor raises pressure.", h_ar: "الضاغط يرفع ضغط مادة التبريد." },
            { type: "mcq", q_en: "Which component releases heat to the outside air?", q_ar: "أي مكون يقوم بطرد الحرارة إلى الهواء الخارجي؟", options: ["Condenser coil", "Evaporator coil", "Air filter", "Blower fan"], a: 0, h_en: "Condenser dissipates heat.", h_ar: "المكثف يطرد الحرارة للبيئة الخارجية." },
            { type: "mcq", q_en: "Escalators in railway stations are mainly used to:", q_ar: "تُستخدم السلالم المتحركة في المحطات لـ:", options: ["Increase train power", "Transport passengers between levels", "Control railway signals", "Operate train doors"], a: 1, h_en: "Vertical transportation.", h_ar: "توفير وسيلة نقل رأسية سهلة." },
            { type: "mcq", q_en: "Which of the following is an escalator component?", q_ar: "أي مما يلي يعد من مكونات السلم المتحرك؟", options: ["Step chain", "Gear reduction", "Electric drive", "All of the above"], a: 3, h_en: "Multiple mechanical parts.", h_ar: "جميع الخيارات من المكونات الأساسية." },
            { type: "mcq", q_en: "Auxiliary systems in trains include:", q_ar: "تشمل الأنظمة المساعدة في القطارات:", options: ["Batteries", "Generators", "Compressed air systems", "All of the above"], a: 3, h_en: "Support functions.", h_ar: "تشمل البطاريات والمولدات وأنظمة الهواء." },
            { type: "mcq", q_en: "Which system is mainly responsible for operating train air brakes?", q_ar: "أي نظام مسؤول عن تشغيل المكابح الهوائية؟", options: ["Hydraulic system", "Compressed air system", "Cooling system", "Fuel system"], a: 1, h_en: "Air brake actuation.", h_ar: "يعتمد نظام الكبح على الهواء المضغوط." },
            { type: "mcq", q_en: "The air dryer in a compressed air system is used to:", q_ar: "يُستخدم مجفف الهواء في نظام الهواء لـ:", options: ["Increase air pressure", "Remove moisture from compressed air", "Cool the locomotive engine", "Generate electricity"], a: 1, h_en: "Prevents water accumulation.", h_ar: "يمنع الرطوبة التي تسبب أعطالاً." },
            { type: "mcq", q_en: "Alternators in trains are used to:", q_ar: "تُستخدم المولدات (Alternators) لـ:", options: ["Generate AC electrical power", "Control escalators", "Reduce train speed", "Compress air"], a: 0, h_en: "AC power generation.", h_ar: "تحويل الطاقة الميكانيكية لكهربائية." },
            { type: "mcq", q_en: "What is the primary function of a train coupler?", q_ar: "ما هي الوظيفة الأساسية لوصلة القطار؟", options: ["Passenger comfort", "Coach decoration", "Connecting coaches and transmitting forces", "Noise insulation"], a: 2, h_en: "Mechanical force transmission.", h_ar: "ربط العربات ونقل قوى الجر والكبح." },
            { type: "mcq", q_en: "Which coupler is considered obsolete due to safety risks?", q_ar: "أي وصلة تعتبر قديمة بسبب مخاطر السلامة؟", options: ["Buckeye", "Screw coupling", "Bar coupler", "Link-and-Pin"], a: 3, h_en: "19th-century system.", h_ar: "نظام قديم وخطير جداً على العمال." },
            { type: "mcq", q_en: "Which coupler is mainly used in fixed-formation trainsets?", q_ar: "أي وصلة تُستخدم في المجموعات الثابتة؟", options: ["Screw coupling", "Bar coupler", "Buckeye coupler", "Scharfenberg coupler"], a: 1, h_en: "Semi-permanent bar.", h_ar: "الوصل القضيبي للعربات التي نادراً ما تنفصل." },
            { type: "mcq", q_en: "The Screw Coupling relies on which additional component to absorb shock?", q_ar: "تعتمد الوصلة اللولبية على أي مكون لامتصاص الصدمات؟", options: ["Knuckle", "Air springs", "Side buffers", "Gear box"], a: 2, h_en: "Compression force handling.", h_ar: "المخمدات الجانبية تمتص قوى الضغط." },
            { type: "mcq", q_en: "Which coupler integrates mechanical, pneumatic, and electrical connections automatically?", q_ar: "أي وصلة تدمج كافة التوصيلات تلقائياً؟", options: ["Buckeye", "Bar coupler", "Screw coupling", "Scharfenberg"], a: 3, h_en: "High-tech automation.", h_ar: "وصل متطور وشامل لكافة الأنظمة." },
            { type: "mcq", q_en: "Which coupler is standard for heavy-haul freight (knuckle shape)?", q_ar: "أي وصلة هي المعيار للشحن الثقيل؟", options: ["Screw coupling", "Buckeye (Janney/Knuckle) coupler", "Bar coupler", "Link-and-Pin"], a: 1, h_en: "Robust knuckle design.", h_ar: "تصميم Buckeye القوي جداً للشحن." },
            { type: "mcq", q_en: "Which door type is considered a major safety risk?", q_ar: "أي نوع من الأبواب يعتبر خطراً كبيراً؟", options: ["Plug doors", "Sliding pocket doors", "Slam doors", "External sliding doors"], a: 2, h_en: "Manual risk factors.", h_ar: "الأبواب اليدوية Slam doors خطيرة جداً." },
            { type: "mcq", q_en: "Which door type provides the best acoustic insulation?", q_ar: "أي نوع يوفر أفضل عزل صوتي؟", options: ["Slam doors", "Bi-folding doors", "Plug doors", "Sliding pocket doors"], a: 2, h_en: "Airtight plug mechanism.", h_ar: "آلية الضغط في Plug doors توفر عزلاً ممتازاً." },
            { type: "mcq", q_en: "Why are sliding pocket doors used in metro systems?", q_ar: "لماذا تُستخدم الأبواب المنزلقة الجيبية بالمترو؟", options: ["Cheaper production", "Reduced maintenance", "Maximize interior space", "Improved aerodynamics"], a: 2, h_en: "Recessed space saving.", h_ar: "لتوفير المساحة وعدم إعاقة الركاب." },
            { type: "mcq", q_en: "Which door system is easiest to maintain?", q_ar: "أي نظام أبواب هو الأسهل في الصيانة؟", options: ["Plug doors", "External sliding doors", "Bi-folding doors", "Slam doors"], a: 1, h_en: "Simple external access.", h_ar: "المسارات الخارجية سهلة التنظيف والصيانة." },
            { type: "mcq", q_en: "In a split air-conditioned coach, the 'evaporator' is responsible for:", q_ar: "في العربة المكيفة، يكون 'المبخر' مسؤولاً عن:", options: ["Compressing refrigerant", "Cooling the air before cabin entry", "Releasing heat outside", "Heating the cabin"], a: 1, h_en: "Absorption of heat.", h_ar: "تبريد الهواء قبل دخوله للعربة." },
            { type: "mcq", q_en: "In a coach heating system, 'convection heaters' are usually located:", q_ar: "سخانات الحمل الحراري توجد عادةً في:", options: ["On the ceiling", "Inside luggage racks", "Near the floor side walls", "In toilet compartments"], a: 2, h_en: "Floor level placement.", h_ar: "توضع قرب الأرضية للسماح للهواء الساخن بالارتفاع." },
            { type: "tf", q_en: "The Link-and-Pin coupler requires automatic operation.", q_ar: "تتطلب وصلة Link-and-Pin تشغيلاً تلقائياً.", a: false, h_en: "Manual and dangerous.", h_ar: "كانت يدوية وخطيرة جداً على العمال." },
            { type: "tf", q_en: "Bar couplers are suitable for trains that frequently change coach numbers.", q_ar: "الوصلات القضيبية مناسبة للقطارات متغيرة العربات.", a: false, h_en: "Semi-permanent connection.", h_ar: "هي وصلات شبه دائمة ويصعب فكها." },
            { type: "tf", q_en: "Screw couplings are common in Europe and the Middle East.", q_ar: "الوصلات اللولبية شائعة في أوروبا والشرق الأوسط.", a: true, h_en: "Standard continental rail.", h_ar: "هي المعيار التقليدي في السكك القارية." },
            { type: "tf", q_en: "Buckeye couplers eliminate the need for workers to stand between coaches.", q_ar: "تلغي Buckeye حاجة العمال للوقوف بين العربات.", a: true, h_en: "Impact automation.", h_ar: "تسمح بالارتباط التلقائي عند التصادم." },
            { type: "tf", q_en: "Scharfenberg couplers allow slack between connected coaches.", q_ar: "تسمح وصلات Scharfenberg بوجود ارتخاء.", a: false, h_en: "Rigid, protective link.", h_ar: "توفر وصلاً صلباً لحماية الأنظمة الدقيقة." },
            { type: "tf", q_en: "Slam doors can be safely opened while the train is moving.", q_ar: "يمكن فتح Slam doors بأمان أثناء الحركة.", a: false, h_en: "Prohibited practice.", h_ar: "خطر جداً وممنوع تماماً في التشغيل الحديث." },
            { type: "tf", q_en: "Bi-folding doors require frequent maintenance due to multiple moving parts.", q_ar: "تتطلب الأبواب ثنائية الطي صيانة مستمرة.", a: true, h_en: "Pivot point wear.", h_ar: "كثرة المفاصل تزيد من احتمالية الأعطال." },
            { type: "tf", q_en: "Plug doors sit flush with the train body to reduce aerodynamic drag.", q_ar: "توضع Plug doors بمستوى الجسم لتقليل مقاومة الهواء.", a: true, h_en: "Aero-efficiency focus.", h_ar: "حيوية لتقليل الضوضاء ومقاومة الهواء." },
            { type: "tf", q_en: "External sliding doors are commonly used in metro systems.", q_ar: "تُستخدم الأبواب المنزلقة الخارجية بكثرة بالمترو.", a: true, h_en: "High-frequency reliability.", h_ar: "توفر تشغيلاً سريعاً وموثوقاً للنقل الحضري." },
            { type: "tf", q_en: "Modern railway engineering focuses on safety, efficiency, and passenger comfort.", q_ar: "تركز الهندسة الحديثة على السلامة والكفاءة والراحة.", a: true, h_en: "Core engineering goals.", h_ar: "تمثل المتطلبات الأساسية للنظم الحديثة." },
            { type: "tf", q_en: "In a 'Screw Coupler' arrangement, the drawbar absorbs pushing forces.", q_ar: "في الوصلة اللولبية، يمتص قضيب الشد قوى الدفع.", a: false, h_en: "Buffers handle push.", h_ar: "المخمدات هي من تمتص قوى الضغط (الدفع)." },
            { type: "tf", q_en: "In a split AC coach, the 'evaporator' releases heat to the environment.", q_ar: "المبخر في التكييف يطرد الحرارة للبيئة المحيطة.", a: false, h_en: "Condenser releases heat.", h_ar: "المكثف هو من يطرد الحرارة للخارج." },
            { type: "tf", q_en: "In a heating system, convection heaters are usually located near the ceiling.", q_ar: "توضع سخانات الحمل عادةً قرب السقف.", a: false, h_en: "Floor level efficiency.", h_ar: "يجب وضعها قرب الأرض ليرتفع الهواء الساخن." }
        ];

        let index = 0;
        let userAnswers = new Array(quizData.length).fill(null);

        const beboMessages = {
            intro: ["جاري تهيئة نظام التقييم التشخيصي. جاهز للبدء."],
            correct: [
                "عاش يا وحش! أداء أسطوري.", "الله ينور عليك، تركيزك في السما!", "ممتاز! كمل يا بطل بنفس الحماس.",
                "وحش! إجابة فنية مية مية.", "رائع، أنت فاهم اللعبة كويس جداً.", "برافو! إجابة أسطورية زي ما توقعت.",
                "عاش يا دحيح، مجهودك جبار.", "تسلم إيدك، إجابة مظبوطة بالملي.", "أحسنت! فخور بيك فعلاً يا وحش."
            ],
            wrong: [
                "غلط تماماً! ركز بقى عشان كدة كتير أوي!",
                "إيه العك ده؟ فوق كدة واقرأ السؤال كويس يا هندسة!",
                "إجابة كارثية! راجع معلوماتك فوراً كدة مينفعش!",
                "غلط! أنت بتهزر ولا إيه؟ ركز بقى شوية!"
            ],
             resultsAdvice: [
                "نتيجتك دى يسطا ولا درجه حراره.",
                "منت لو تبص على التلميحات وانت بتحل مكنتش جبت درجات الحراره دى.",
                "تعي اشب شاى يسطا بالى انت عامله ده.",
                "متزعلش مش مهم درجتك فى الامتحان المهم الصحه والستر.",
                "هيجى شخص يحسسك انك ف كفه والكون كله فى كفه وبعدين يسقفلك بالكفتين على وشك علشان النتيجه الى انت جايبها دى."
            ],
            resultsSuccess: [
                "مشاء الله عليك ",
                "هايل بجد عاش عليك.",
                "شيئ جميل جدا عندك احسن منكده كمان  عاش عليك  ."
            ]
        };

        function setBebo(state, category, specificIdx = -1) {
            const robot = document.getElementById('bebo-robot');
            const bubble = document.getElementById('bebo-bubble');
            let msgs = beboMessages[category];
            robot.className = `bebo-robot ${state}`;
            let chosenMsg = (category === 'correct' && specificIdx !== -1) ? (msgs[specificIdx % msgs.length]) : msgs[Math.floor(Math.random() * msgs.length)];
            bubble.innerText = chosenMsg;
            bubble.classList.add('active');
            setTimeout(() => { 
                bubble.classList.remove('active');
                if(index < quizData.length) robot.classList.remove('success', 'error');
            }, 3800);
        }

        function toggleHint() { document.getElementById('hint-panel').classList.toggle('active'); }

        function init() {
            document.getElementById('total-idx').innerText = quizData.length.toString().padStart(2, '0');
            render();
            setTimeout(() => setBebo('ready', 'intro'), 500);
        }

        function render() {
            const data = quizData[index];
            document.getElementById('current-idx').innerText = (index + 1).toString().padStart(2, '0');
            
            document.getElementById('question-text').innerHTML = `
                <div class="q-ar-box">${data.q_ar}</div>
                <div class="q-en-main">${data.q_en}</div>
            `;
            
            document.getElementById('hint-text').innerHTML = `
                <div style="margin-bottom: 8px; font-weight: 500; font-size: 0.9rem; color: #fff;">${data.h_en}</div>
                <div style="border-top: 1px solid rgba(255,255,255,0.1); padding-top: 8px; font-family: 'Tajawal', sans-serif; text-align: right; direction: rtl; color: var(--text-dim); font-size: 0.85rem;">${data.h_ar}</div>
            `;

            document.getElementById('hint-panel').classList.remove('active');

            const container = document.getElementById('options-container');
            container.innerHTML = '';
            const answered = userAnswers[index] !== null;
            
            document.getElementById('btn-next').disabled = !answered;
            document.getElementById('btn-next').innerText = (index === quizData.length - 1) ? "FINALIZE" : "NEXT";
            document.getElementById('btn-prev').disabled = index === 0;
            
            const btnSkip = document.getElementById('btn-skip');
            if (answered) {
                btnSkip.classList.add('hidden');
            } else {
                btnSkip.classList.remove('hidden');
                btnSkip.innerText = "SKIP";
            }

            if (data.type === "mcq") {
                container.className = "options-grid";
                data.options.forEach((opt, i) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerHTML = `<span class="char-idx">${String.fromCharCode(65 + i)}</span> <span>${opt}</span>`;
                    if (answered) {
                        btn.disabled = true;
                        if (i === data.a) btn.classList.add('correct');
                        if (userAnswers[index] === i && i !== data.a) btn.classList.add('wrong');
                    } else { btn.onclick = () => select(i); }
                    container.appendChild(btn);
                });
            } else {
                container.className = "options-grid two-cols";
                [true, false].forEach(val => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.style.justifyContent = 'center';
                    btn.innerText = val ? "TRUE" : "FALSE";
                    if (answered) {
                        btn.disabled = true;
                        if (val === data.a) btn.classList.add('correct');
                        if (userAnswers[index] === val && val !== data.a) btn.classList.add('wrong');
                    } else { btn.onclick = () => select(val); }
                    container.appendChild(btn);
                });
            }
            document.getElementById('progress-bar').style.width = ((index + 1) / quizData.length * 100) + '%';
        }

        function select(choice) {
            if (userAnswers[index] !== null) return;
            userAnswers[index] = choice;
            const correct = choice === quizData[index].a;
            setBebo(correct ? 'success' : 'error', correct ? 'correct' : 'wrong', index);
            render();
        }

        function move(dir) {
            if (dir === 1 && index === quizData.length - 1) { finish(); }
            else { index += dir; render(); }
        }

        function finish() {
            document.getElementById('quiz-ui').classList.add('hidden');
            document.getElementById('results-ui').classList.remove('hidden');
            document.querySelector('.bebo-wrapper').classList.add('hidden');
            const score = userAnswers.filter((a, i) => a === quizData[i].a).length;
            const pct = Math.round(score / quizData.length * 100);
            document.getElementById('final-pct').innerText = pct + '%';
            const fb = document.getElementById('final-feedback');
            const category = pct >= 85 ? 'resultsSuccess' : 'resultsAdvice';
            fb.innerText = beboMessages[category][Math.floor(Math.random() * beboMessages[category].length)];
        }

        window.onload = init;
    </script>
</body>
</html>
