<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rolling Stock | Technical Assessment</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');

        :root {
            --accent-red: #e63946;
            --accent-red-dim: #9b2226;
            --header-bg: #1a1a1a;
            --page-bg: #0a0a0a;
            --card-bg: #141414;
            --surface-bg: #1e1e1e;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --success: #10b981;
            --error: #ef4444;
            --border: #2a2a2a;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--page-bg);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* --- Header --- */
        header {
            background-color: var(--header-bg);
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid var(--accent-red);
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        header h1 {
            color: var(--text-main);
            font-size: 1.25rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            font-weight: 800;
        }

        header h1 span {
            color: var(--accent-red);
        }

        /* --- Main Content --- */
        .viewport {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 15px;
        }

        .assessment-container {
            width: 100%;
            max-width: 700px;
            perspective: 1000px;
        }

        /* --- Card Design --- */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            padding: 2rem;
            border-radius: 4px;
            position: relative;
            transition: var(--transition);
            animation: cardEnter 0.6s ease-out;
            overflow: hidden;
        }

        @keyframes cardEnter {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* --- Progress Bar --- */
        .progress-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 4px;
            background: #222;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-red-dim), var(--accent-red));
            transition: width 0.5s var(--transition);
            box-shadow: 0 0 10px var(--accent-red);
        }

        .context-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            flex-wrap: wrap;
            gap: 10px;
        }

        .context-label {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--accent-red);
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 5px 10px;
            background: rgba(230, 57, 70, 0.1);
            border-radius: 2px;
        }

        /* --- Toggle Hint System --- */
        .hint-toggle {
            background: none;
            border: 1px solid var(--border);
            color: var(--text-dim);
            font-size: 0.65rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 5px 10px;
            cursor: pointer;
            border-radius: 2px;
            transition: var(--transition);
        }

        .hint-box {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out, margin 0.3s ease, padding 0.3s ease;
            background: #0f0f0f;
            border-left: 2px solid var(--accent-red);
        }

        .hint-box.visible {
            max-height: 200px;
            margin-bottom: 1.5rem;
            padding: 1rem;
            overflow-y: auto;
        }

        .hint-content {
            color: var(--text-dim);
            font-size: 0.8rem;
            line-height: 1.5;
        }

        .meta-info {
            font-size: 0.65rem;
            color: var(--text-dim);
            margin-bottom: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .question-body {
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.4;
            margin-bottom: 2rem;
            color: #fff;
        }

        /* --- Response Grid --- */
        .response-grid {
            display: grid;
            gap: 10px;
            margin-bottom: 1.5rem;
        }

        .response-grid.dual {
            grid-template-columns: 1fr 1fr;
        }

        .option-btn {
            background: var(--surface-bg);
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 0.9rem 1.1rem;
            text-align: left;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 12px;
            border-radius: 2px;
            width: 100%;
        }

        .option-btn span {
            flex-shrink: 0;
            width: 20px;
            font-weight: 700;
            color: var(--accent-red);
        }

        .option-btn:hover:not(:disabled) {
            border-color: var(--accent-red);
            color: #fff;
            background: #252525;
        }

        .option-btn.correct {
            background: rgba(16, 185, 129, 0.15) !important;
            border-color: var(--success) !important;
            color: var(--success) !important;
        }

        .option-btn.wrong {
            background: rgba(239, 68, 68, 0.15) !important;
            border-color: var(--error) !important;
            color: var(--error) !important;
        }

        /* --- Navigation --- */
        .navigation-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1.5rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border);
            gap: 10px;
        }

        .nav-link {
            background: none;
            border: none;
            color: var(--text-dim);
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            transition: var(--transition);
        }

        .action-btn {
            background: var(--accent-red);
            color: #fff;
            border: none;
            padding: 0.7rem 1.2rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            transition: var(--transition);
            border-radius: 2px;
            font-size: 0.75rem;
        }

        .clear-link {
            display: block;
            text-align: center;
            margin-top: 1.5rem;
            color: #444;
            font-size: 0.7rem;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
        }

        /* --- Results --- */
        .results-panel { text-align: center; padding: 2.5rem 1.5rem; }
        .score-display {
            font-size: 3rem;
            font-weight: 800;
            color: var(--accent-red);
            margin: 1.5rem 0;
        }
        .score-sub {
            color: var(--text-dim);
            margin-bottom: 2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 0.75rem;
        }

        footer {
            background: #000;
            padding: 1.5rem;
            text-align: center;
            color: #444;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-top: 1px solid #1a1a1a;
        }

        .hidden { display: none; }

        svg { width: 16px; height: 16px; fill: currentColor; }

        /* --- Small Screen Specifics --- */
        @media (max-width: 480px) {
            .card { padding: 1.5rem; }
            .question-body { font-size: 1rem; }
            .navigation-row { flex-direction: row; flex-wrap: wrap; justify-content: space-around; }
            .nav-link { font-size: 0.65rem; }
            .action-btn { width: 100%; order: -1; margin-bottom: 10px; padding: 0.85rem; }
            .response-grid.dual { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <h1>Rolling<span>Stock</span></h1>
    </header>

    <main class="viewport">
        <div class="assessment-container">
            
            <div id="quiz-ui">
                <div class="card" id="main-card">
                    <div class="progress-container">
                        <div class="progress-bar" id="progress-bar"></div>
                    </div>

                    <div class="context-header">
                        <div class="context-label">
                            <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                            Context
                        </div>
                        <button class="hint-toggle" id="hint-toggle-btn" onclick="toggleHint()">Show Hint</button>
                    </div>

                    <div id="hint-box" class="hint-box">
                        <div class="hint-content" id="hint-text">...</div>
                    </div>
                    
                    <div class="meta-info">Step <span id="current-index">01</span> / <span id="total-questions">25</span></div>
                    <div class="question-body" id="question-content">Loading...</div>

                    <div id="options-container" class="response-grid">
                        <!-- Options loaded via JS -->
                    </div>

                    <div class="navigation-row">
                        <button class="nav-link" onclick="goPrev()">
                            <svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg>
                            Back
                        </button>
                        <button class="nav-link" onclick="goNext()">
                            Skip
                        </button>
                        <button class="action-btn" id="next-btn" onclick="goNext()">
                            Next Question
                        </button>
                    </div>

                    <a class="clear-link" onclick="clearAnswer()">Reset Selection</a>
                </div>
            </div>

            <div id="results-ui" class="hidden">
                <div class="card results-panel">
                    <div class="context-label">Complete</div>
                    <div class="score-display" id="final-percentage">0%</div>
                    <div class="score-sub" id="final-raw">0 / 25 Correct</div>
                    <button class="action-btn" style="width: 100%" onclick="location.reload()">Restart Assessment</button>
                </div>
            </div>

        </div>
    </main>

    <footer>
        Developed by Bilal Mohamed
    </footer>

    <script>
        const quizData = [
            { type: "mcq", q: "What is the primary function of a train coupler?", options: ["Passenger comfort", "Coach decoration", "Connecting coaches and transmitting forces", "Noise insulation"], a: 2, h: "Rolling stock requires a mechanical link to transmit traction and braking forces along the train." },
            { type: "mcq", q: "Which coupler is considered obsolete due to safety risks?", options: ["Buckeye", "Screw coupling", "Bar coupler", "Link-and-Pin"], a: 3, h: "This 19th-century system caused many fatalities as staff had to stand between cars to insert pins." },
            { type: "mcq", q: "Which coupler is mainly used in fixed-formation trainsets?", options: ["Screw coupling", "Bar coupler", "Buckeye coupler", "Scharfenberg coupler"], a: 1, h: "A semi-permanent bar is used when coaches are rarely detached, common in EMUs/DMUs." },
            { type: "mcq", q: "The Screw Coupling relies on which additional component to absorb shock (pushing forces)?", options: ["Knuckle", "Air springs", "Side buffers", "Gear box"], a: 2, h: "Side buffers handle the compression forces, while the screw coupling handles the tension." },
            { type: "mcq", q: "Which coupler integrates mechanical, pneumatic, and electrical connections (fully automatic)?", options: ["Buckeye", "Bar coupler", "Screw coupling", "Scharfenberg"], a: 3, h: "A high-tech coupler that automatically connects air and signal lines simultaneously." },
            { type: "mcq", q: "Which coupler is standard for heavy-haul freight railways (characterized by a 'knuckle' shape)?", options: ["Screw coupling", "Buckeye (Janney/Knuckle) coupler", "Bar coupler", "Link-and-Pin"], a: 1, h: "The knuckle design is robust enough for extremely heavy North American and Australian freight trains." },
            { type: "mcq", q: "Which door type is considered a major safety risk?", options: ["Plug doors", "Sliding pocket doors", "Slam doors", "External sliding doors"], a: 2, h: "These manually latched doors could swing open during motion and were phased out for safety." },
            { type: "mcq", q: "Which door type provides the best acoustic insulation?", options: ["Slam doors", "Bi-folding doors", "Plug doors", "Sliding pocket doors"], a: 2, h: "The plug mechanism pushes the door against the frame, creating a superior airtight/acoustic seal." },
            { type: "mcq", q: "Why are sliding pocket doors used in urban rail (metro) systems?", options: ["They are cheaper", "They reduce maintenance", "They maximize interior space", "They improve aerodynamics"], a: 2, h: "Recessing into the walls prevents them from obstructing the aisle or the platform space." },
            { type: "mcq", q: "Which door system is easiest to maintain?", options: ["Plug doors", "External sliding doors", "Bi-folding doors", "Slam doors"], a: 1, h: "External tracks are simple to access and clean compared to internal mechanisms." },
            { type: "mcq", q: "In a split air-conditioned coach, the 'evaporator' is typically responsible for:", options: ["Compressing the refrigerant gas", "Cooling the air before it is blown into the passenger area", "Releasing heat to the outside environment", "Heating the cabin during winter"], a: 1, h: "Heat from the cabin air is absorbed into the refrigerant at the evaporator stage." },
            { type: "mcq", q: "In a coach heating system, 'convection heaters' are usually located:", options: ["On the ceiling", "Inside the luggage racks", "Near the floor level along the side walls", "Inside the toilet compartments"], a: 2, h: "Natural convection relies on hot air rising, necessitating floor-level placement." },
            { type: "tf", q: "The Link-and-Pin coupler requires automatic operation.", a: false, h: "It is a manual system that required shunt workers to stand between vehicles." },
            { type: "tf", q: "Bar couplers are suitable for trains that frequently change coach numbers.", a: false, h: "Bar couplers are semi-permanent and difficult to decouple quickly." },
            { type: "tf", q: "Screw couplings are common in Europe and the Middle East.", a: true, h: "This is the traditional standard across many continental rail systems." },
            { type: "tf", q: "Buckeye couplers eliminate the need for workers to stand between coaches.", a: true, h: "The automatic knuckle mechanism engages upon impact." },
            { type: "tf", q: "Scharfenberg couplers allow slack between connected coaches.", a: false, h: "They provide a tight, rigid connection to protect air and electrical links." },
            { type: "tf", q: "Slam doors can be safely opened while the train is moving.", a: false, h: "This practice is extremely dangerous and strictly prohibited in modern operations." },
            { type: "tf", q: "Bi-folding doors require frequent maintenance due to multiple moving parts.", a: true, h: "More hinges and pivots increase the likelihood of mechanical failure." },
            { type: "tf", q: "Plug doors sit flush with the train body to reduce aerodynamic drag.", a: true, h: "This feature is vital for energy efficiency and noise reduction on high-speed lines." },
            { type: "tf", q: "External sliding doors are commonly used in metro systems.", a: true, h: "They provide reliable, fast operation for high-frequency urban transit." },
            { type: "tf", q: "Modern railway engineering focuses on safety, efficiency, and passenger comfort.", a: true, h: "These represent the fundamental engineering requirements of modern rolling stock." },
            { type: "tf", q: "In a 'Screw Coupler' arrangement, the drawbar is primarily used to absorb the pushing forces.", a: false, h: "Drawbars pull (tension); side buffers absorb the push (compression)." },
            { type: "tf", q: "In a split air-conditioned coach, the 'evaporator' is typically responsible for releasing heat to the outside environment.", a: false, h: "The condenser releases heat; the evaporator absorbs it from the cabin." },
            { type: "tf", q: "In a coach heating system, 'convection heaters' are usually located near the ceiling for maximum efficiency.", a: false, h: "Heating efficiency is maximized when units are placed at floor level to allow heat to rise." }
        ];

        let currentIndex = 0;
        let userAnswers = new Array(quizData.length).fill(null);
        let hintVisible = false;

        const card = document.getElementById('main-card');
        const hintBox = document.getElementById('hint-box');
        const hintText = document.getElementById('hint-text');
        const hintToggleBtn = document.getElementById('hint-toggle-btn');
        const qText = document.getElementById('question-content');
        const idxDisplay = document.getElementById('current-index');
        const totalDisplay = document.getElementById('total-questions');
        const optionsContainer = document.getElementById('options-container');
        const progressBar = document.getElementById('progress-bar');
        const nextBtn = document.getElementById('next-btn');

        function init() {
            totalDisplay.innerText = quizData.length.toString().padStart(2, '0');
            renderQuestion();
        }

        function toggleHint() {
            hintVisible = !hintVisible;
            if (hintVisible) {
                hintBox.classList.add('visible');
                hintToggleBtn.innerText = "Hide Hint";
            } else {
                hintBox.classList.remove('visible');
                hintToggleBtn.innerText = "Show Hint";
            }
        }

        function resetHint() {
            hintVisible = false;
            hintBox.classList.remove('visible');
            hintToggleBtn.innerText = "Show Hint";
        }

        function updateProgressBar() {
            const answeredCount = userAnswers.filter(a => a !== null).length;
            const progress = (answeredCount / quizData.length) * 100;
            progressBar.style.width = progress + '%';
        }

        function renderQuestion() {
            const data = quizData[currentIndex];
            idxDisplay.innerText = (currentIndex + 1).toString().padStart(2, '0');
            qText.innerText = data.q;
            hintText.innerText = data.h;
            
            resetHint();
            updateProgressBar();

            card.style.animation = 'none';
            card.offsetHeight; 
            card.style.animation = 'cardEnter 0.6s ease-out';

            optionsContainer.innerHTML = '';
            const isAnswered = userAnswers[currentIndex] !== null;
            
            // Highlight Next Button if answered
            nextBtn.style.opacity = isAnswered ? "1" : "0.7";

            if (data.type === "mcq") {
                optionsContainer.className = "response-grid";
                data.options.forEach((opt, i) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.innerHTML = `<span>${String.fromCharCode(65 + i)}</span> ${opt}`;
                    btn.onclick = () => handleSelect(i);
                    
                    if (isAnswered) {
                        btn.disabled = true;
                        if (i === data.a) btn.classList.add('correct');
                        if (userAnswers[currentIndex] === i && i !== data.a) btn.classList.add('wrong');
                    }
                    optionsContainer.appendChild(btn);
                });
            } else {
                optionsContainer.className = "response-grid dual";
                [true, false].forEach((val) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.style.justifyContent = "center";
                    btn.innerText = val ? "TRUE" : "FALSE";
                    btn.onclick = () => handleSelect(val);
                    
                    if (isAnswered) {
                        btn.disabled = true;
                        if (val === data.a) btn.classList.add('correct');
                        if (userAnswers[currentIndex] === val && val !== data.a) btn.classList.add('wrong');
                    }
                    optionsContainer.appendChild(btn);
                });
            }
        }

        function handleSelect(choice) {
            if (userAnswers[currentIndex] !== null) return;
            userAnswers[currentIndex] = choice;
            renderQuestion();
        }

        function goNext() {
            if (currentIndex < quizData.length - 1) {
                currentIndex++;
                renderQuestion();
            } else if (userAnswers.filter(a => a !== null).length === quizData.length) {
                showResults();
            } else {
                // If skipping last question or trying to finish without answering all
                showResults();
            }
        }

        function goPrev() {
            if (currentIndex > 0) {
                currentIndex--;
                renderQuestion();
            }
        }

        function clearAnswer() {
            userAnswers[currentIndex] = null;
            renderQuestion();
        }

        function showResults() {
            document.getElementById('quiz-ui').classList.add('hidden');
            const resultsUi = document.getElementById('results-ui');
            resultsUi.classList.remove('hidden');

            const score = userAnswers.reduce((total, ans, idx) => {
                return (ans === quizData[idx].a) ? total + 1 : total;
            }, 0);

            const percentage = Math.round((score / quizData.length) * 100);
            document.getElementById('final-percentage').innerText = percentage + '%';
            document.getElementById('final-raw').innerText = `${score} / ${quizData.length} Corrected Entries`;
        }

        window.onload = init;
    </script>
</body>
</html>
