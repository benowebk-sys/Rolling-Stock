<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-DPSZJKBK6M"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-DPSZJKBK6M');

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Rolling stock</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Oswald:wght@500;700&family=Noto+Sans+Arabic:wght@400;700&display=swap" rel="stylesheet">
    <style>
:root{
    --pure-black:#000000;
    --dark-gray:#111111;
    --mid-gray:#1f1f1f;
    --light-gray:#333333;
    --brand-red:#e11d48;
    --brand-red-hover:#be123c;
    --brand-green:#10b981;
    --text-light:#f8fafc;
}

body{
    font-family:'Inter','Noto Sans Arabic',sans-serif;
    background-color:var(--pure-black);
    color:var(--text-light);
    margin:0;
    overflow-x:hidden;
    min-height:100vh;
    display:flex;
    flex-direction:column;
    -webkit-tap-highlight-color:transparent;
}

.oswald{font-family:'Oswald',sans-serif;}

.glass-effect{
    background:rgba(10,10,10,0.9);
    backdrop-filter:blur(12px);
    border-bottom:2px solid var(--brand-red);
}

.dark-card{
    background:var(--dark-gray);
    border:1px solid var(--light-gray);
    box-shadow:0 10px 30px rgba(0,0,0,0.5);
}

.btn-red{
    background-color:var(--brand-red);
    transition:all .3s ease;
}

.btn-red:active{transform:scale(.98);}
.btn-red:hover:not(:disabled){background-color:var(--brand-red-hover);}

.btn-outline{
    border:1px solid var(--light-gray);
    background:transparent;
    transition:all .3s ease;
}

.fade-in{animation:fadeIn .5s ease-out forwards;}

@keyframes fadeIn{
from{opacity:0;transform:translateY(10px);}
to{opacity:1;transform:translateY(0);}
}

/* ===== LOGO FIX ===== */

.train-logo-responsive{
width:70px;
height:70px;
object-fit:cover;
border-radius:12px;
border:2px solid var(--brand-red);
box-shadow:0 0 20px rgba(225,29,72,.45);
transition:.3s;
}

.train-logo-responsive:hover{
transform:scale(1.05);
}

@media(min-width:768px){
.train-logo-responsive{
width:110px;
height:110px;
}
}

/* ===== NAMES LINE ===== */

.names-line{
display:flex;
gap:30px;
align-items:center;
color:#ef4444;
font-weight:600;
font-size:14px;
letter-spacing:3px;
text-transform:uppercase;
}

/* Mobile */

@media(max-width:640px){

header{padding:10px!important;}

#ui-title{font-size:15px!important;}

.names-line{
font-size:9px!important;
gap:12px;
letter-spacing:1px;
}

.train-logo-responsive{
width:50px;
height:50px;
}

.welcome-title{font-size:24px!important;}

#ui-welcome-desc{font-size:13px!important;}

#ui-start-btn{
font-size:14px;
padding:12px 24px;
}

#question-text{font-size:17px!important;}

.option-card{
padding:12px!important;
font-size:14px!important;
}

}

.option-card{
cursor:pointer;
transition:all .2s ease;
background:var(--mid-gray);
border:1px solid transparent;
user-select:none;
}

.option-correct{
background:rgba(16,185,129,.15)!important;
border-color:var(--brand-green)!important;
box-shadow:0 0 15px rgba(16,185,129,.1);
}

.option-wrong{
background:rgba(225,29,72,.15)!important;
border-color:var(--brand-red)!important;
box-shadow:0 0 15px rgba(225,29,72,.1);
}

.progress-bar-fill{
transition:width .6s cubic-bezier(.4,0,.2,1);
background:linear-gradient(90deg,#9f1239,#e11d48);
}

[dir="rtl"] .oswald{
font-family:'Noto Sans Arabic',sans-serif;
font-weight:700;
}

[dir="rtl"] .tracking-widest{
letter-spacing:0;
}
</style>
</head>
<body>

    <!-- Header -->
    <header class="w-full py-3 px-4 md:px-8 glass-effect sticky top-0 z-50">
        <div class="max-w-6xl mx-auto flex items-center justify-between gap-3">
            <div class="flex items-center gap-3 md:gap-6">
                <img src="logo.jpg" alt="Logo" class="train-logo-responsive" onerror="this.src='https://via.placeholder.com/100/fff/e11d48?text=LOGO'">
                <div class="min-w-0">
                    <h1 id="ui-title" class="oswald text-lg md:text-2xl font-bold tracking-tight text-white uppercase leading-tight truncate">Train Detection & Equipment</h1>
                    <div id="ui-names" class="mt-1 border-l-2 border-red-600 pl-2 leading-tight">
                        <div class="names-line">
                            <span>D/Eyd</span>
                            <span>Eng/Ahmed Mohamed</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <button onclick="toggleLanguage()" class="btn-outline px-3 py-1.5 rounded-lg text-[10px] md:text-xs font-bold uppercase flex items-center gap-1 shrink-0 text-white">
                <span id="lang-label">العربية</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-3 w-3" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129" /></svg>
            </button>
        </div>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center p-4 md:p-8 relative">
        <!-- Welcome Section -->
        <section id="welcome-screen" class="max-w-3xl w-full text-center fade-in py-10">
            <h2 id="ui-welcome-title" class="welcome-title text-4xl md:text-7xl font-bold mb-6 text-white leading-tight uppercase oswald">
                Train Detection
            </h2>
            <p id="ui-welcome-desc" class="text-gray-400 text-sm md:text-xl mb-10 max-w-2xl mx-auto font-light leading-relaxed">
                Professional assessment covering railway rolling stock systems, including couplers, door mechanisms.
            </p>
            <button onclick="startQuiz()" id="ui-start-btn" class="btn-red text-white font-bold py-5 px-12 md:px-20 rounded-full text-lg md:text-2xl shadow-2xl uppercase tracking-[0.2em]">
                START ASSESSMENT
            </button>
        </section>

        <!-- Quiz Section -->
        <section id="quiz-screen" class="hidden max-w-3xl w-full fade-in">
            <div class="mb-8">
                <div class="flex justify-between items-end mb-3">
                    <span id="current-question-num" class="text-red-500 font-bold text-xs md:text-sm uppercase tracking-widest font-mono">STEP 01</span>
                    <span id="progress-text" class="text-gray-500 text-[10px] md:text-xs font-mono">0% READY</span>
                </div>
                <div class="w-full bg-stone-900 h-1.5 rounded-full overflow-hidden">
                    <div id="progress-bar" class="progress-bar-fill h-full w-0"></div>
                </div>
            </div>
            <div class="dark-card rounded-2xl p-6 md:p-12">
<button onclick="showHint()" class="btn-outline w-full py-2 mb-4">
 Hint
</button>
<div id="hintBox" class="text-yellow-400 mb-4 text-sm"></div>
<h3 id="question-text" class="text-xl md:text-3xl font-bold mb-10 text-white leading-tight">...</h3>
<div id="options-container" class="grid gap-4"></div>   
                <div class="mt-12 flex flex-col gap-4">
                    <div class="flex gap-4">
                        <button id="prev-btn" onclick="prevQuestion()" class="btn-outline flex-1 text-white font-bold py-4 px-4 rounded-xl text-xs md:text-base opacity-50">
                            ← <span id="ui-back">Back</span>
                        </button>
                        <button id="skip-btn" onclick="skipQuestion()" class="btn-outline flex-1 text-white font-bold py-4 px-4 rounded-xl text-xs md:text-base">
                            <span id="ui-skip">Skip</span>
                        </button>
                    </div>
                    <button id="next-btn" onclick="nextQuestion()" disabled class="btn-red w-full text-white font-bold py-5 rounded-xl text-sm md:text-xl disabled:opacity-20 uppercase tracking-widest">
                        <span id="ui-next">Continue</span> →
                    </button>
                </div>
            </div>
        </section>

        <!-- Result Section -->
        <section id="result-screen" class="hidden max-w-2xl w-full text-center fade-in">
            <div class="dark-card rounded-3xl p-10 border-t-8 border-red-600">
                <h2 id="ui-done" class="text-3xl md:text-4xl font-bold mb-6 text-white uppercase oswald">System Check Finalized</h2>
                
                <div class="flex justify-center gap-8 mb-10">
                    <div>
                        <div id="final-score" class="text-5xl md:text-6xl font-bold text-red-600">0</div>
                        <div id="ui-points" class="text-gray-500 uppercase text-xs tracking-widest mt-2">Correct</div>
                    </div>
                    <div class="w-px h-16 bg-white/10"></div>
                    <div>
                        <div id="final-percent" class="text-5xl md:text-6xl font-bold text-white">0%</div>
                        <div id="ui-accuracy" class="text-gray-500 uppercase text-xs tracking-widest mt-2">Accuracy</div>
                    </div>
                </div>

                <div id="motivational-msg" class="text-white bg-[#3C2947] p-6 rounded-2xl mb-10 font-bold text-lg md:text-xl">
                    Evaluation complete.
                </div>

                <button onclick="restartQuiz()" id="ui-restart" class="btn-red w-full text-white font-bold py-5 rounded-2xl text-lg uppercase tracking-widest shadow-xl">
                    RE-INITIALIZE
                </button>
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="w-full py-10 px-4 bg-black border-t border-white/5">
        <div class="max-w-6xl mx-auto text-center">
            <div id="ui-footer-prog" class="oswald text-xl md:text-2xl font-bold tracking-[0.3em] text-red-600 uppercase mb-2">
                By Programmer Bilal Mohammed
            </div>
            <div id="ui-footer-sub" class="text-gray-600 text-[10px] md:text-xs uppercase tracking-[0.2em] font-medium">
                &nbsp;
            </div>
        </div>
    </footer>

    <script>
        const translations = {
            en: {
                title: "Rolling stock",
                welcomeTitle: "Rolling stock",
                startBtn: "START ASSESSMENT",
                back: "Back",
                skip: "Skip",
                next: "Continue",
                done: "System Check Finalized",
                points: "Correct",
                accuracy: "Accuracy",
                restart: "RE-INITIALIZE",
                langBtn: "العربية",
                qPrefix: "STEP",
                complete: "READY",
                footerProg: "By Programmer Bilal Mohammed",
                footerSub: "&nbsp;",
                msg: "Your effort is appreciated! Keep learning."
            },
           
        };
const rawQuestions = [

{
en:{
q:"What is the primary function of a train coupler?",
o:["Passenger comfort","Coach decoration","Connecting coaches and transmitting forces","Noise insulation"],
hint:"It is the device used to connect train coaches together."
},
ans:2
},

{
en:{
q:"Which coupler is considered obsolete due to safety risks?",
o:["Buckeye","Screw coupling","Bar coupler","Link-and-Pin"],
hint:"This old system required workers to stand between railcars."
},
ans:3
},

{
en:{
q:"Which coupler is mainly used in fixed-formation trainsets?",
o:["Screw coupling","Bar coupler","Buckeye coupler","Scharfenberg coupler"],
hint:"It creates a semi-permanent connection between cars."
},
ans:1
},

{
en:{
q:"The Screw Coupling relies on which additional component to absorb shock?",
o:["Knuckle","Air springs","Side buffers","Gear box"],
hint:"Look at the round plates on both sides between European coaches."
},
ans:2
},

{
en:{
q:"Which coupler integrates mechanical pneumatic and electrical connections?",
o:["Buckeye","Bar coupler","Screw coupling","Scharfenberg"],
hint:"Modern high-speed trains and metros commonly use this coupler."
},
ans:3
},

{
en:{
q:"Which coupler is standard for heavy-haul freight railways?",
o:["Screw coupling","Buckeye coupler","Bar coupler","Link-and-Pin"],
hint:"This coupler has a knuckle shape and locks automatically."
},
ans:1
},

{
en:{
q:"Which door type is considered a major safety risk?",
o:["Plug doors","Sliding pocket doors","Slam doors","External sliding doors"],
hint:"Old trains had passengers opening this door manually."
},
ans:2
},

{
en:{
q:"Which door type provides the best acoustic insulation?",
o:["Slam doors","Bi-folding doors","Plug doors","Sliding pocket doors"],
hint:"This door seals tightly against the train body."
},
ans:2
},

{
en:{
q:"Why are sliding pocket doors used in urban rail systems?",
o:["They are cheaper","They reduce maintenance","They maximize interior space","They improve aerodynamics"],
hint:"These doors slide inside the wall so they save space."
},
ans:2
},

{
en:{
q:"Which door system is easiest to maintain?",
o:["Plug doors","External sliding doors","Bi-folding doors","Slam doors"],
hint:"This door slides outside the train body."
},
ans:1
},

{
en:{
q:"Which coupler type has a knuckle shape and is standard for heavy-haul trains?",
o:["Link and Pin","Screw Coupler","Buckeye Coupler","Bar Coupler"],
hint:"Also called the Janney coupler."
},
ans:2
},

{
en:{
q:"In a Screw Coupler arrangement what absorbs pushing forces between coaches?",
o:["The drawbar","Side buffers","The knuckle","The pivot pin"],
hint:"These round buffers are placed on both sides of the coupler."
},
ans:1
},

{
en:{
q:"Which door is flush with the bodyside and moves outward before sliding?",
o:["Slam door","Sliding pocket door","Plug door","Bi-folding door"],
hint:"The door pops out slightly before sliding."
},
ans:2
},

{
en:{
q:"Slam doors are mainly characterized by:",
o:["Being operated by compressed air","Hinged doors opened manually outward","Sliding into a wall cavity","Folding in the middle"],
hint:"Passengers used to slam this door shut."
},
ans:1
},

{
en:{
q:"A Sliding Pocket Door differs from an Exterior Sliding Door because:",
o:["It opens faster","It slides into a cavity within the coach wall","It is used only for freight","It requires no electricity"],
hint:"The door disappears inside the wall."
},
ans:1
},

{
en:{
q:"In a split air conditioned coach the evaporator is responsible for:",
o:["Compressing refrigerant gas","Cooling the air before entering the cabin","Releasing heat outside","Heating the cabin"],
hint:"This component absorbs heat from the air."
},
ans:1
}

];

        let currentLang = 'en';
        let currentIdx = 0;
        let userAnswers = new Array(rawQuestions.length).fill(null);

        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'ar' : 'en';
            document.documentElement.dir = currentLang === 'ar' ? 'rtl' : 'ltr';
            updateUIStrings();
            if (!document.getElementById('quiz-screen').classList.contains('hidden')) loadQuestion();
        }

        function updateUIStrings() {
            const t = translations[currentLang];
            document.getElementById('ui-title').innerText = t.title;
            document.getElementById('ui-welcome-title').innerHTML = t.welcomeTitle;
            document.getElementById('ui-start-btn').innerText = t.startBtn;
            document.getElementById('ui-back').innerText = t.back;
            document.getElementById('ui-skip').innerText = t.skip;
            document.getElementById('ui-next').innerText = t.next;
            document.getElementById('ui-done').innerText = t.done;
            document.getElementById('ui-points').innerText = t.points;
            document.getElementById('ui-accuracy').innerText = t.accuracy;
            document.getElementById('ui-restart').innerText = t.restart;
            document.getElementById('lang-label').innerText = t.langBtn;
            document.getElementById('ui-footer-prog').innerText = t.footerProg;
            document.getElementById('ui-footer-sub').innerHTML = t.footerSub;
        }

        function startQuiz() {
            window.scrollTo(0, 0);
            document.getElementById('welcome-screen').classList.add('hidden');
            document.getElementById('quiz-screen').classList.remove('hidden');
            currentIdx = 0;
            userAnswers = new Array(rawQuestions.length).fill(null);
            loadQuestion();
        }

        function loadQuestion() {
            const data = rawQuestions[currentIdx][currentLang];
            const t = translations[currentLang];
            const userAnswer = userAnswers[currentIdx];
            const correctAns = rawQuestions[currentIdx].ans;
            document.getElementById("hintBox").innerText = "";
            
            document.getElementById('current-question-num').innerText = `${t.qPrefix} ${String(currentIdx + 1).padStart(2, '0')}`;
            document.getElementById('question-text').innerText = data.q;
            
            const progress = Math.round((currentIdx / rawQuestions.length) * 100);
            document.getElementById('progress-bar').style.width = `${progress}%`;
            document.getElementById('progress-text').innerText = `${progress}% ${t.complete}`;

            const container = document.getElementById('options-container');
            container.innerHTML = '';
            
            data.o.forEach((opt, i) => {
                const card = document.createElement('div');
                let cardClass = `option-card p-5 rounded-xl flex items-center gap-4 text-white font-semibold border border-white/5 `;
                
                // Logic for showing correct/incorrect
                if (userAnswer !== null && userAnswer !== -1) {
                    if (i === correctAns) {
                        cardClass += " option-correct ";
                    } else if (i === userAnswer) {
                        cardClass += " option-wrong ";
                    }
                } else if (userAnswer === i) {
                     cardClass += " border-red-600 bg-red-600/10 ";
                }
                
                card.className = cardClass;
                
                const bulletColor = (userAnswer !== null && userAnswer !== -1 && i === correctAns) ? 'text-white bg-green-600' : 
                                    (userAnswer !== null && userAnswer !== -1 && i === userAnswer) ? 'text-white bg-red-600' : 'text-red-500 bg-black';

                card.innerHTML = `
                    <div class="w-8 h-8 rounded-lg flex items-center justify-center font-black border border-red-600/20 ${bulletColor}">
                        ${String.fromCharCode(65 + i)}
                    </div>
                    <span>${opt}</span>
                `;

                if (userAnswer === null) {
                    card.onclick = () => {
                        userAnswers[currentIdx] = i;
                        loadQuestion();
                    };
                } else {
                    card.style.cursor = 'default';
                }
                container.appendChild(card);
            });

            const prevBtn = document.getElementById('prev-btn');
            prevBtn.disabled = currentIdx === 0;
            prevBtn.style.opacity = currentIdx === 0 ? '0.2' : '1';
            document.getElementById('next-btn').disabled = userAnswers[currentIdx] === null;
        }

        function nextQuestion() {
            if (currentIdx < rawQuestions.length - 1) {
                currentIdx++;
                loadQuestion();
            } else {
                calculateResults();
            }
        }

        function prevQuestion() {
            if (currentIdx > 0) {
                currentIdx--;
                loadQuestion();
            }
        }

        function skipQuestion() {
            if (userAnswers[currentIdx] === null) userAnswers[currentIdx] = -1;
            nextQuestion();
        }

        function calculateResults() {
            window.scrollTo(0, 0);
            document.getElementById('quiz-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            
            let score = 0;
            userAnswers.forEach((ans, i) => {
                if (ans === rawQuestions[i].ans) score++;
            });

            document.getElementById('final-score').innerText = score;
            const pct = Math.round((score / rawQuestions.length) * 100);
            document.getElementById('final-percent').innerText = `${pct}%`;
        }

        function restartQuiz() {
            location.reload();
        }

        updateUIStrings();
       function showHint(){
document.getElementById("hintBox").innerText =
rawQuestions[currentIdx][currentLang].hint;
}
    </script>
</body>
</html>
